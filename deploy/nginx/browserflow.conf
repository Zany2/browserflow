# BrowserFlow Server site configuration.
# This Docker deployment proxies all BrowserFlow traffic to the GoFrame backend.
# The backend executable already embeds the frontend dist assets.

server {
    # Listen inside the nginx container. docker-compose maps host port 8001 to this port.
    listen       80;

    # Accept all Host values by default. Change this to your domain or server IP in production.
    server_name  _;

    # BrowserFlow may upload workflow files and return result files; 0 disables the request body size limit.
    client_max_body_size 0;

    # BrowserFlow WebSocket proxy.
    # client-agent/browser-agent use this connection to register, send heartbeats,
    # receive tasks, and return execution results.
    # WebSocket must keep Upgrade and Connection headers.
    location /api/v1/ws {
        proxy_pass http://browserflow:8001/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request information so the backend can resolve real client IPs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Workflow execution can take a long time, so keep proxy timeouts longer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # BrowserFlow backend HTTP API proxy.
    # The frontend requests /api/v1/..., which is forwarded to the backend service.
    location /api/ {
        proxy_pass http://browserflow:8001/api/;
        proxy_http_version 1.1;

        # Forward original request information so the backend can resolve real client IPs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # BrowserFlow frontend pages and static assets.
    # In this deployment, frontend dist is embedded into the backend executable,
    # so non-API requests are proxied to the backend as well.
    location / {
        proxy_pass http://browserflow:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
